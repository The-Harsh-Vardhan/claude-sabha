# Plan: Pro ($20). Loaded after sabha.conf by `sabha-up.sh --plan pro` (or SABHA_PLAN=pro in sabha.conf): only the
# roster, the panes, the copies and the labels live here; paths and project names stay in sabha.conf.
# Pro has no fable; models are pinned so a session never falls back to the account default. The one standing grid
# is five panes; every other profile is a subagent of the dispatcher, started for one brief at a time.
SABHA_ROSTER="Relay:claude:sonnet:medium Dispatcher:claude:sonnet:medium Architect:claude:opus:medium:ondemand BuilderHeavy:claude:sonnet:high BuilderPrecise:claude:sonnet:medium Reviewer:claude:haiku:high:ondemand Writer:claude:sonnet:low"
# Panes in grid order; the relay is pane 1 so it restarts like the rest.
SABHA_PANES="Relay Dispatcher BuilderHeavy BuilderPrecise Writer"
# Copies (BuilderPrecise-1, BuilderPrecise-2) as subagents, each with its own inbox, status file and worktree.
SABHA_MAX_COPIES=2
SABHA_LABEL_Relay="Relay"
SABHA_LABEL_Dispatcher="Dispatcher"
# One hard brief at a time: the architect is a subagent, not a pane.
SABHA_LABEL_Architect="Architect"
SABHA_LABEL_BuilderHeavy="Builder"
SABHA_LABEL_BuilderPrecise="Builder"
SABHA_LABEL_Reviewer="Reviewer"
SABHA_LABEL_Writer="Writer"
