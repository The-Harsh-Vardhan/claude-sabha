# Plan: Pro ($20). Loaded after sabha.conf by `sabha-up.sh --plan pro` (or SABHA_PLAN=pro in sabha.conf): only the
# roster, the panes, the copies and the labels live here; paths and project names stay in sabha.conf.
# Pro has no fable; models are pinned so a session never falls back to the account default. The one standing grid
# is five panes; every other profile is a subagent of the dispatcher, started for one brief at a time.
SABHA_ROSTER="Vidur:claude:sonnet:medium Yudhishthira:claude:sonnet:medium Bhishma:claude:opus:medium:ondemand Bhima:claude:sonnet:high Arjun:claude:sonnet:medium Sahadev:claude:haiku:high:ondemand Nakul:claude:sonnet:low"
# Panes in grid order; the relay is pane 1 so it restarts like the rest.
SABHA_PANES="Vidur Yudhishthira Bhima Arjun Nakul"
# Copies (Arjun-1, Arjun-2) as subagents, each with its own inbox, status file and worktree.
SABHA_MAX_COPIES=2
SABHA_LABEL_Vidur="Relay"
SABHA_LABEL_Yudhishthira="Dispatcher"
# One hard brief at a time: the architect is a subagent, not a pane.
SABHA_LABEL_Bhishma="Architect"
SABHA_LABEL_Bhima="Builder"
SABHA_LABEL_Arjun="Builder"
SABHA_LABEL_Sahadev="Reviewer"
SABHA_LABEL_Nakul="Writer"
