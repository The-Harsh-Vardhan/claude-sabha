# Plan: Max 5x ($100). Loaded after sabha.conf by `sabha-up.sh --plan max5` (or SABHA_PLAN=max5 in sabha.conf): only
# the roster, the panes, the copies and the labels live here; paths and project names stay in sabha.conf.
# The same five panes as Pro plus a standing reviewer and runner; opus for the relay, the dispatcher and the gates.
SABHA_ROSTER="Vidur:claude:opus:medium Yudhishthira:claude:opus:medium Bhishma:claude:opus:medium:ondemand Bhima:claude:sonnet:high Arjun:claude:sonnet:medium Sahadev:claude:opus:medium Nakul:claude:sonnet:low Karna:claude:sonnet:low Shakuni:claude:opus:medium:ondemand Dushasan:claude:opus:medium:ondemand"
# Panes in grid order; the relay is pane 1 so it restarts like the rest.
SABHA_PANES="Vidur Yudhishthira Bhima Arjun Nakul Sahadev Karna"
SABHA_MAX_COPIES=4
SABHA_LABEL_Vidur="Relay"
SABHA_LABEL_Yudhishthira="Dispatcher"
SABHA_LABEL_Bhishma="Architect"
SABHA_LABEL_Bhima="Builder"
SABHA_LABEL_Arjun="Builder"
SABHA_LABEL_Sahadev="Reviewer"
SABHA_LABEL_Nakul="Writer"
SABHA_LABEL_Karna="Runner"
SABHA_LABEL_Shakuni="Security critic"
SABHA_LABEL_Dushasan="Frontend critic"
