# Plan: Max 5x ($100). Loaded after sabha.conf by `sabha-up.sh --plan max5` (or SABHA_PLAN=max5 in sabha.conf): only
# the roster, the panes, the copies and the labels live here; paths and project names stay in sabha.conf.
# The same five panes as Pro plus a standing reviewer and runner; opus for the relay, the dispatcher and the gates.
SABHA_ROSTER="Relay:claude:opus:medium Dispatcher:claude:opus:medium Architect:claude:opus:medium:ondemand BuilderHeavy:claude:sonnet:high BuilderPrecise:claude:sonnet:medium Reviewer:claude:opus:medium Writer:claude:sonnet:low Runner:claude:sonnet:low SecurityCritic:claude:opus:medium:ondemand FrontendCritic:claude:opus:medium:ondemand"
# Panes in grid order; the relay is pane 1 so it restarts like the rest.
SABHA_PANES="Relay Dispatcher BuilderHeavy BuilderPrecise Writer Reviewer Runner"
SABHA_MAX_COPIES=4
SABHA_LABEL_Relay="Relay"
SABHA_LABEL_Dispatcher="Dispatcher"
SABHA_LABEL_Architect="Architect"
SABHA_LABEL_BuilderHeavy="Builder"
SABHA_LABEL_BuilderPrecise="Builder"
SABHA_LABEL_Reviewer="Reviewer"
SABHA_LABEL_Writer="Writer"
SABHA_LABEL_Runner="Runner"
SABHA_LABEL_SecurityCritic="Security critic"
SABHA_LABEL_FrontendCritic="Frontend critic"
