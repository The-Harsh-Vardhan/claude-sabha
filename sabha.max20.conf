# Plan: Max 20x ($200). Loaded after sabha.conf by `sabha-up.sh --plan max20` (or SABHA_PLAN=max20 in sabha.conf):
# only the roster, the panes, the copies and the labels live here; paths and project names stay in sabha.conf.
# The full grid: a Build tab of eight panes, a Gate tab of two, six lazy gate critics started per brief, and three
# on-demand roles. Rows: Name:agent:model[:effort[:flags]]; flags gate = second tab, lazy = started when a brief
# lands (bin/sabha-run), ondemand = never a pane.
SABHA_ROSTER="Vidur:claude:opus:medium Yudhishthira:claude:opus:medium Bhishma:claude:fable:medium Bhima:claude:opus:high Arjun:claude:opus:medium Sahadev:claude:sonnet:high Nakul:claude:sonnet:medium Karna:claude:sonnet:medium Sanjaya:claude:haiku:high Duryodhan:claude:opus:high:gate,lazy Dushasan:claude:sonnet:high:gate,lazy Shakuni:claude:opus:high:gate,lazy Draupadi:claude:sonnet:high:gate,lazy Gandhari:claude:sonnet:medium:gate,lazy VedVyasa:claude:sonnet:medium:gate,lazy Barbarika:claude:haiku:medium:gate Abhimanyu:claude:haiku:medium:gate Krishna:claude:opus:medium:ondemand Ashwatthama:claude:haiku:high:ondemand Dronacharya:claude:sonnet:medium:ondemand"
# Panes in grid order: the relay first, then the Build tab, then the Gate tab (gate flag). Eight per tab at most, so
# the scribe runs on demand.
SABHA_PANES="Vidur Yudhishthira Bhishma Bhima Arjun Sahadev Nakul Karna Barbarika Abhimanyu"
SABHA_MAX_COPIES=4
SABHA_LABEL_Vidur="Relay"
SABHA_LABEL_Yudhishthira="Dispatcher"
SABHA_LABEL_Bhishma="Architect"
SABHA_LABEL_Bhima="Builder"
SABHA_LABEL_Arjun="Builder"
SABHA_LABEL_Sahadev="Reviewer"
SABHA_LABEL_Nakul="Writer"
SABHA_LABEL_Karna="Runner"
SABHA_LABEL_Sanjaya="Scribe"
SABHA_LABEL_Duryodhan="Backend critic"
SABHA_LABEL_Dushasan="Frontend critic"
SABHA_LABEL_Shakuni="Security critic"
SABHA_LABEL_Draupadi="Scope critic"
SABHA_LABEL_Gandhari="Blind reviewer"
SABHA_LABEL_VedVyasa="Keeper of record"
SABHA_LABEL_Barbarika="Observer"
SABHA_LABEL_Abhimanyu="Housekeeper"
SABHA_LABEL_Krishna="Tutor"
SABHA_LABEL_Ashwatthama="Post-merge watcher"
SABHA_LABEL_Dronacharya="Agent coach"
