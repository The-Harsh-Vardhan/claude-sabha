# Plan: Max 20x ($200). Loaded after sabha.conf by `sabha-up.sh --plan max20` (or SABHA_PLAN=max20 in sabha.conf):
# only the roster, the panes, the copies and the labels live here; paths and project names stay in sabha.conf.
# The full grid: a Build tab of eight panes, a Gate tab of two, six lazy gate critics started per brief, and three
# on-demand roles. Rows: Name:agent:model[:effort[:flags]]; flags gate = second tab, lazy = started when a brief
# lands (bin/sabha-run), ondemand = never a pane.
SABHA_ROSTER="Relay:claude:opus:medium Dispatcher:claude:opus:medium Architect:claude:fable:medium BuilderHeavy:claude:opus:high BuilderPrecise:claude:opus:medium Reviewer:claude:sonnet:high Writer:claude:sonnet:medium Runner:claude:sonnet:medium Scribe:claude:haiku:high BackendCritic:claude:opus:high:gate,lazy FrontendCritic:claude:sonnet:high:gate,lazy SecurityCritic:claude:opus:high:gate,lazy ScopeCritic:claude:sonnet:high:gate,lazy BlindReviewer:claude:sonnet:medium:gate,lazy Keeper:claude:sonnet:medium:gate,lazy Observer:claude:haiku:medium:gate Housekeeper:claude:haiku:medium:gate Tutor:claude:opus:medium:ondemand Watcher:claude:haiku:high:ondemand Coach:claude:sonnet:medium:ondemand"
# Panes in grid order: the relay first, then the Build tab, then the Gate tab (gate flag). Eight per tab at most, so
# the scribe runs on demand.
SABHA_PANES="Relay Dispatcher Architect BuilderHeavy BuilderPrecise Reviewer Writer Runner Observer Housekeeper"
SABHA_MAX_COPIES=4
SABHA_LABEL_Relay="Relay"
SABHA_LABEL_Dispatcher="Dispatcher"
SABHA_LABEL_Architect="Architect"
SABHA_LABEL_BuilderHeavy="Builder"
SABHA_LABEL_BuilderPrecise="Builder"
SABHA_LABEL_Reviewer="Reviewer"
SABHA_LABEL_Writer="Writer"
SABHA_LABEL_Runner="Runner"
SABHA_LABEL_Scribe="Scribe"
SABHA_LABEL_BackendCritic="Backend critic"
SABHA_LABEL_FrontendCritic="Frontend critic"
SABHA_LABEL_SecurityCritic="Security critic"
SABHA_LABEL_ScopeCritic="Scope critic"
SABHA_LABEL_BlindReviewer="Blind reviewer"
SABHA_LABEL_Keeper="Keeper of record"
SABHA_LABEL_Observer="Observer"
SABHA_LABEL_Housekeeper="Housekeeper"
SABHA_LABEL_Tutor="Tutor"
SABHA_LABEL_Watcher="Post-merge watcher"
SABHA_LABEL_Coach="Agent coach"
