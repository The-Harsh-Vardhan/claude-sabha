# Plan: five-pane. Loaded after sabha.conf by `sabha-up.sh --plan five` (or SABHA_PLAN=five in sabha.conf): only the
# roster, the panes, the copies and the labels live here; paths and project names stay in sabha.conf.
# Exactly five always-on sessions, the relay one of them: Relay (you talk to it), Dispatcher, BuilderPrecise (implementation
# only), Runner (builds, gates, test suites, e2e, the gate review) and Architect, the Elephant (the one memory service: other
# roles ask it with bin/sabha-ask instead of reading each other's status and inbox files). Every other role is a headless
# helper (lazy, started by sabha-run) or on demand. In the Mahabharat theme: Vidur, Yudhishthira, Arjun, Karna, Bhishma.
SABHA_ROSTER="Relay:claude:opus:medium Dispatcher:claude:opus:medium BuilderPrecise:claude:opus:medium Runner:claude:sonnet:medium Architect:claude:opus:medium BuilderHeavy:claude:opus:high:lazy Reviewer:claude:sonnet:high:lazy Writer:claude:sonnet:medium:lazy Scribe:claude:haiku:high:lazy BackendCritic:claude:opus:high:gate,lazy FrontendCritic:claude:sonnet:high:gate,lazy SecurityCritic:claude:opus:high:gate,lazy ScopeCritic:claude:sonnet:high:gate,lazy BlindReviewer:claude:sonnet:medium:gate,lazy Keeper:claude:sonnet:medium:gate,lazy Tutor:claude:opus:medium:ondemand Coach:claude:sonnet:medium:ondemand"
SABHA_PANES="Relay Dispatcher BuilderPrecise Runner Architect"
SABHA_MAX_HEADFUL=5
SABHA_MAX_COPIES=1
SABHA_ELEPHANT=Architect
SABHA_LABEL_Relay="Relay"
SABHA_LABEL_Dispatcher="Dispatcher"
SABHA_LABEL_BuilderPrecise="Builder"
SABHA_LABEL_Runner="Tester"
SABHA_LABEL_Architect="Elephant"
SABHA_PROMPT_Runner="then run what the builder hands you (builds, gates, test suites, e2e, local stack, screenshots) and review gates; paste each gate evidence line raw. Report to the dispatcher."
SABHA_PROMPT_Architect="then refresh docs/sabha/bhishma/INDEX.md from the status files and inbox markers. You are the Elephant: answer questions from the other roles (bin/sabha-ask) with the fact and its file:line source; do no design work, send that to a helper. Report to the dispatcher."
