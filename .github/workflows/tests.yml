name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hermetic:
    name: hermetic suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install bash jq shellcheck coreutils; else sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck; fi
      - name: shellcheck
        # errors fail the build; warnings and infos are reported but do not (existing ones are tracked separately)
        run: shellcheck -x -P SCRIPTDIR --severity=error bin/sabha-up.sh bin/sabha-watch bin/sabha-run bin/sabha-lib.sh
      - name: python compiles
        run: python3 -m py_compile bin/sabha-for-me
      - name: tests/test-*.sh (hermetic; smoke-live.sh needs a real claude and is not run here)
        if: always()
        run: |
          fail=0
          for t in tests/test-*.sh; do
            if out=$(timeout 300 bash "$t" 2>&1); then echo "ok   $t"; else echo "FAIL $t"; echo "$out" | tail -20; fail=$((fail+1)); fi
          done
          echo "failed: $fail"
          [ "$fail" -eq 0 ]
